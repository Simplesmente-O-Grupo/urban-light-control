services:
  api:
    build: ./api
    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/ulcontrol

  db:
    image: postgres:13

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ulcontrol

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ulcontrol"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4

    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin

    ports:
      - "8080:80"

    depends_on:
      - db
  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    volumes:
      - type: bind
        source: "$PWD/mosquitto/config/"
        target: "/mosquitto/config/"
    ports:
      - "1883:1883"

  mqtt-client:
    environment:
#      MQTT_CLIENT_USER: ${MQTT_CLIENT_USER}
#      MQTT_CLIENT_PASSWORD: ${MQTT_CLIENT_PASSWORD}
      DATABASE_URL: postgresql://user:password@db:5432/ulcontrol
    build:
      context: ./worker/
    depends_on:
      - mosquitto
      - db

volumes:
  db_data:
